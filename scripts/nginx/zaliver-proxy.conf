# Nginx reverse proxy: Zaliver API + Antidetect
#
# Domains point to this host's IP; nginx routes by Host header:
#   zaliver.*     -> 127.0.0.1:8080
#   antidetect.*  -> 127.0.0.1:18765
#
# Edit server_name below, then:
#   sudo bash scripts/nginx/install-zaliver-proxy.sh

# --- upstreams ---------------------------------------------------------------

upstream zaliver_backend {
    server 127.0.0.1:8080;
    keepalive 16;
}

upstream antidetect_backend {
    server 127.0.0.1:18765;
    keepalive 16;
}

# --- Zaliver (API + web UI) --------------------------------------------------
# Replace server_name with your domain(s), e.g.:
#   server_name zaliver.example.com api.example.com;

server {
    listen 80;
    listen [::]:80;
    server_name zaliver.example.com;

    # Video uploads can be large
    client_max_body_size 4G;
    client_body_timeout 600s;

    location / {
        proxy_pass http://zaliver_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        # Long-running jobs / streaming responses
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

# --- Antidetect local API ----------------------------------------------------
# Replace server_name with your domain(s), e.g.:
#   server_name antidetect.example.com ad.example.com;

server {
    listen 80;
    listen [::]:80;
    server_name antidetect.example.com;

    client_max_body_size 100M;

    location / {
        proxy_pass http://antidetect_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}

